
# Local smoke test before pushing images:
# docker compose up --build
# Open http://localhost:1234 and register a new user to test.

services:
  devopsdb:
    image: karkamprashanth/project1:db
    ports:
      - "3306:3306"
    networks:
      - network1
    volumes:
      - volume1:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: localrootpass
      MYSQL_USER: vprofile
      MYSQL_PASSWORD: localapppass
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      retries: 12
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 100M
        limits:
          cpus: "1.0"
          memory: 200M

  app:
    image: karkamprashanth/project1:app
    ports:
      - "1234:8080"
    networks:
      - network1
    environment:
      JDBC_URL: "jdbc:mysql://devopsdb:3306/accounts?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false"
      JDBC_USERNAME: vprofile
      JDBC_PASSWORD: localapppass
    deploy:
      resources:
        reservations:
          cpus: "0.5"
          memory: 100M
        limits:
          cpus: "1.0"
          memory: 200M
    depends_on:
      devopsdb:
        condition: service_healthy

networks:
  network1:
    driver: bridge

volumes:
  volume1:
